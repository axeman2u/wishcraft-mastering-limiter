name: Windows Build

# Builds the plugin on a real Windows runner (this project has no Windows toolchain
# available anywhere else) and packages it into an Inno Setup installer. Runs on a
# version tag push (produces a release-ready installer) or manually via the Actions
# tab for a test build without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      trial:
        description: "Build a time-limited TRIAL version (see Source/TrialLicense.h) instead of the normal release"
        type: boolean
        default: false
      trial_days:
        description: "Trial length in days (only used if trial is checked)"
        type: string
        default: "30"

jobs:
  build-windows:
    # Pinned rather than windows-latest: at the time this was written, windows-latest
    # was mid-transition to a newer runner image on which CMake's "Visual Studio 17
    # 2022" generator couldn't find any VS install ("could not find any instance of
    # Visual Studio") -- windows-2022 is the known-good image with VS 2022 preinstalled.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project version from CMakeLists.txt
        id: version
        shell: bash
        run: |
          version=$(grep -m1 'project(WishcraftMasteringLimiter VERSION' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure (CMake fetches JUCE 9.0.1 automatically -- see CMakeLists.txt)
        shell: bash
        run: |
          if [ "${{ github.event.inputs.trial }}" = "true" ]; then
            echo "==> TRIAL build: WISHCRAFT_TRIAL_BUILD=ON, ${{ github.event.inputs.trial_days }}-day trial"
            cmake -B build -G "Visual Studio 17 2022" -A x64 \
              -DWISHCRAFT_TRIAL_BUILD=ON -DWISHCRAFT_TRIAL_DAYS=${{ github.event.inputs.trial_days }}
          else
            cmake -B build -G "Visual Studio 17 2022" -A x64
          fi

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        # cmd, not bash: git-bash/MSYS auto-mangles any argument starting with "/"
        # (like /DTRIAL=1) into a Windows path before ISCC ever sees it, which is what
        # broke this step the first time -- ISCC read the mangled path as a second
        # script filename and refused to run ("You may not specify more than one script
        # filename"). cmd has no such path-conversion behavior.
        shell: cmd
        run: |
          if "${{ github.event.inputs.trial }}"=="true" (
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} /DTRIAL=1 "Packaging\Windows\installer.iss"
          ) else (
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} "Packaging\Windows\installer.iss"
          )

      - name: Set artifact name
        id: artifact_name
        shell: bash
        run: |
          if [ "${{ github.event.inputs.trial }}" = "true" ]; then
            echo "name=Wishcraft-Mastering-Limiter-Windows-Installer-TRIAL" >> "$GITHUB_OUTPUT"
          else
            echo "name=Wishcraft-Mastering-Limiter-Windows-Installer" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
